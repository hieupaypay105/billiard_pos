name: billiard_pos_mobile
description: Billiard POS Mobile Client for Waiters
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  core_shared:
    path: ../../packages/core_shared
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.1

  # HTTP Client & API
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.1
  crypto: ^3.0.3

  # UI
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  printing: ^5.14.3
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
